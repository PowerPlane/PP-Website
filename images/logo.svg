<svg viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper airplane body -->
  <path d="M5 30 L70 25 L40 45 Z" fill="none" stroke="#000" stroke-width="1.5"/>
  <path d="M5 30 L70 25 L35 35 L5 30" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Fold line -->
  <path d="M40 45 L35 35" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- DC Motor coil -->
  <ellipse cx="58" cy="32" rx="8" ry="5" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M50 32 Q54 28 58 32 Q62 36 66 32" fill="none" stroke="#000" stroke-width="0.75"/>
  <!-- Motor leads -->
  <line x1="52" y1="36" x2="48" y2="42" stroke="#000" stroke-width="1"/>
  <line x1="64" y1="36" x2="68" y2="42" stroke="#000" stroke-width="1"/>
  <!-- + and - symbols -->
  <text x="46" y="46" font-size="6" fill="#000">+</text>
  <text x="68" y="46" font-size="6" fill="#000">−</text>
</svg>
