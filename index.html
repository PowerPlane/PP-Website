<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Plane, LLC — Custom Electronics & Connected Devices</title>
    <meta
      name="description"
      content="Power Plane designs and prototypes custom electronics and interactive connected devices. Hardware and firmware development for creative projects, research, and small products."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ============================================
       MAIN DATASHEET FRAME
       ============================================ -->
    <main class="datasheet">
      <div class="frame">
        <!-- HEADER ROW -->
        <header class="header">
          <div class="title-block">
            <h1 class="company-name">POWER PLANE, LLC</h1>
            <div class="underline"></div>
          </div>

          <!-- LOGO - Replace images/logo.svg to change logo -->
          <div class="logo">
            <img src="images/logo.png" alt="Power Plane logo" />
          </div>
        </header>

        <!-- DESCRIPTION FIELDS -->
        <section class="fields">
          <!-- COMPANY INFO - Edit text directly -->
          <div class="field">
            <span class="label">DESC</span>
            <span class="connector">────</span>
            <span class="value">Custom electronics & connected devices</span>
          </div>

          <div class="field">
            <span class="label">TYPE</span>
            <span class="connector">────</span>
            <span class="value">Hardware + Firmware development</span>
          </div>

          <div class="field">
            <span class="label">FOR</span>
            <span class="connector">─────</span>
            <span class="value"
              >Creative projects, research, small products</span
            >
          </div>

          <div class="divider"></div>

          <!-- TEAM -->
          <div class="field">
            <span class="label">TEAM</span>
            <span class="connector">────</span>
            <span class="value">David Yang, Shuang Cai</span>
          </div>

          <div class="divider"></div>

          <!-- CONTACT - Edit links directly -->
          <div class="field">
            <span class="label">EMAIL</span>
            <span class="connector">───</span>
            <a href="mailto:davidyangemail@gmail.com" class="value link"
              >davidyangemail@gmail.com</a
            >
          </div>

          <div class="field">
            <span class="label">IG</span>
            <span class="connector">──────</span>
            <span class="value">
              <a
                href="https://instagram.com/dav1dyang"
                class="link"
                target="_blank"
                rel="noopener"
                >@dav1dyang</a
              >
              <span class="separator">·</span>
              <a
                href="https://instagram.com/fkialmostforgot"
                class="link"
                target="_blank"
                rel="noopener"
                >@fkialmostforgot</a
              >
            </span>
          </div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
          <span class="revision">REV 1.0</span>
          <span class="year">© 2026</span>
        </footer>
      </div>
    </main>

    <!-- Flying planes script -->
    <script src="flyers.js"></script>
  </body>
</html>
